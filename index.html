<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Data Analyst | محلّل البيانات الذكي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F3F6FB;--surface:#FFFFFF;--surface2:#F7F9FC;--ink:#0D1B2A;--muted:#566780;--line:#DCE3EE;
  --brand:#0E8A8C;--brand-d:#0A6B6D;--brand-ink:#FFFFFF;--accent:#F2A900;--bad:#D64545;--ok:#1B9A5F;--soft:#E3F3F3;
  --shadow:0 6px 24px rgba(13,27,42,.08);--grid:rgba(13,27,42,.09);
  --c1:#0E8A8C;--c2:#0D1B2A;--c3:#F2A900;--c4:#E4572E;--c5:#6C5CE7;--c6:#3FA7D6;--c7:#2EBF91;--c8:#9AA9BC;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1220;--surface:#111C2E;--surface2:#0E1828;--ink:#E7EEF8;--muted:#9BAAC2;--line:#22324B;
    --brand:#2CC3C5;--brand-d:#59D3D5;--brand-ink:#06222A;--accent:#F5B731;--bad:#FF7A7A;--ok:#4CD494;--soft:#10303A;
    --shadow:0 6px 24px rgba(0,0,0,.35);--grid:rgba(231,238,248,.12);
    --c1:#2CC3C5;--c2:#C7D6EA;--c3:#F5B731;--c4:#FF8A5C;--c5:#9A8CFF;--c6:#63B9E6;--c7:#4CD494;--c8:#6F7F96;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1220;--surface:#111C2E;--surface2:#0E1828;--ink:#E7EEF8;--muted:#9BAAC2;--line:#22324B;
  --brand:#2CC3C5;--brand-d:#59D3D5;--brand-ink:#06222A;--accent:#F5B731;--bad:#FF7A7A;--ok:#4CD494;--soft:#10303A;
  --shadow:0 6px 24px rgba(0,0,0,.35);--grid:rgba(231,238,248,.12);
  --c1:#2CC3C5;--c2:#C7D6EA;--c3:#F5B731;--c4:#FF8A5C;--c5:#9A8CFF;--c6:#63B9E6;--c7:#4CD494;--c8:#6F7F96;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif;font-size:16px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 64px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;background:var(--brand);display:flex;align-items:flex-end;justify-content:center;gap:4px;padding:9px}
.logo i{display:block;width:6px;border-radius:2px;background:var(--brand-ink)}
.brand h1{font-size:1.25rem;margin:0;font-weight:900;line-height:1.2}
.brand p{margin:0;color:var(--muted);font-size:.86rem}
.tools{display:flex;gap:8px}
.btn{font:inherit;font-weight:700;font-size:.92rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:10px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:8px;line-height:1.2}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand-d);border-color:var(--brand-d);color:var(--brand-ink)}
.btn.small{padding:6px 12px;font-size:.82rem;border-radius:8px}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px;margin-bottom:18px}
.card h2{margin:0 0 4px;font-size:1.15rem;font-weight:900}
.card .sub{margin:0 0 14px;color:var(--muted);font-size:.9rem}
.hero{background:linear-gradient(135deg,#0D1B2A 0%,#0E5F66 100%);color:#fff;border:none}
.hero h2{font-size:1.5rem;margin-bottom:6px}
.hero .sub{color:#C5D6E4;margin:0}
.drop{margin-top:16px;border:2px dashed var(--line);border-radius:14px;padding:26px 16px;text-align:center;cursor:pointer;background:var(--surface2);transition:.15s}
.drop:hover,.drop.over{border-color:var(--brand);background:var(--soft)}
.drop b{display:block;font-size:1.05rem}
.drop span{color:var(--muted);font-size:.86rem}
.drop svg{width:34px;height:34px;stroke:var(--brand);margin-bottom:6px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sp{flex:1}
.status{margin-top:12px;font-size:.92rem;color:var(--muted)}
.status.err{color:var(--bad);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi small{display:block;color:var(--muted);font-size:.8rem}
.kpi b{display:block;font-size:1.55rem;font-weight:900;line-height:1.2;margin-top:2px;overflow-wrap:anywhere}
.scroll{overflow-x:auto;max-width:100%;border:1px solid var(--line);border-radius:12px}
table.tbl{border-collapse:collapse;width:100%;font-size:.88rem}
.tbl th,.tbl td{padding:8px 12px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.tbl th{background:var(--surface2);font-weight:700;color:var(--muted);position:sticky;top:0}
.tbl td.num,.tbl th.num{text-align:end;font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:none}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.76rem;font-weight:700;background:var(--soft);color:var(--brand)}
.tag.t-number{background:#E3EEFB;color:#2459A6}.tag.t-date{background:#FDF0D5;color:#8A5A00}.tag.t-category{background:#E3F3F3;color:#0A6B6D}.tag.t-text{background:#EEE9F8;color:#5A3FA0}.tag.t-id{background:#EDEFF3;color:#566780}
.sectitle{font-weight:900;font-size:.95rem;margin:18px 0 8px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px 18px}
.opts label{display:flex;align-items:center;gap:8px;font-size:.92rem;cursor:pointer}
.opts select,.field select,.field input,textarea{font:inherit;font-size:.92rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;max-width:100%}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--brand);flex:none}
.log{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.log li{background:var(--soft);border-radius:9px;padding:7px 12px;font-size:.9rem}
.log li.none{background:var(--surface2);color:var(--muted)}
textarea{width:100%;min-height:92px;resize:vertical;line-height:1.6;padding:12px 14px;border-radius:12px;font-size:1rem}
textarea:focus,select:focus,input:focus,.btn:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{font:inherit;font-size:.84rem;font-weight:600;border:1px solid var(--line);background:var(--surface2);color:var(--ink);padding:5px 12px;border-radius:99px;cursor:pointer}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.ai{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.ai label{display:flex;gap:8px;align-items:center;color:var(--ink);font-weight:700;cursor:pointer;font-size:.9rem}
.msg{margin-top:12px;padding:10px 14px;border-radius:10px;font-size:.92rem;background:var(--soft)}
.msg.warn{background:#FDF0D5;color:#6B4600}
:root[data-theme="dark"] .msg.warn{background:#3A2E10;color:#F5D58A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .msg.warn{background:#3A2E10;color:#F5D58A}}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:6px}
.field label{display:block;font-size:.78rem;color:var(--muted);font-weight:700;margin-bottom:4px}
.field select,.field input{width:100%}
.filterrow{display:grid;grid-template-columns:1.2fr .7fr 1.2fr;gap:6px}
.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:16px;align-items:start}
.res{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px 18px;min-width:0}
.res.wide{grid-column:1/-1}
.res h3{margin:0;font-size:1.02rem;font-weight:900;line-height:1.35}
.res .you{margin:2px 0 10px;color:var(--muted);font-size:.8rem}
.res .ins{margin:12px 0 0;padding:9px 12px;border-radius:10px;background:var(--soft);font-size:.9rem}
.res .bar{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.chartbox{position:relative;height:320px}
.bigk{font-size:2.6rem;font-weight:900;color:var(--brand);line-height:1.15;margin:6px 0;overflow-wrap:anywhere}
.empty{text-align:center;color:var(--muted);padding:30px 10px;border:2px dashed var(--line);border-radius:14px}
.foot{text-align:center;color:var(--muted);font-size:.8rem;margin-top:30px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:640px){.wrap{padding:12px 12px 56px}.hero h2{font-size:1.25rem}.chartbox{height:280px}.brand p{display:none}.filterrow{grid-template-columns:1fr}}
</style>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true"><i style="height:10px"></i><i style="height:16px"></i><i style="height:22px"></i></div>
      <div><h1 data-i="app"></h1><p data-i="tagShort"></p></div>
    </div>
    <div class="tools">
      <button class="btn small" id="btnLang" type="button"></button>
      <button class="btn small" id="btnTheme" type="button" aria-label="theme">◐</button>
    </div>
  </header>

  <section class="card hero" id="secUpload">
    <h2 data-i="tag"></h2>
    <p class="sub" data-i="tagSub"></p>
    <div class="drop" id="drop" tabindex="0" role="button">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4m0 0l-4 4m4-4l4 4"/><path d="M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/></svg>
      <b data-i="drop"></b><span data-i="dropHint"></span>
      <input type="file" id="file" accept=".xlsx,.xls,.xlsm,.csv,.tsv,.txt" hidden>
    </div>
    <div class="row" style="margin-top:14px"><button class="btn" id="btnDemo" type="button" style="color:#0D1B2A" data-i="demo"></button></div>
    <div class="status" id="upStatus" style="color:#C5D6E4"></div>
  </section>

  <div id="main" hidden>
    <section class="card" id="secOverview">
      <div class="row">
        <div><h2 data-i="overview"></h2><p class="sub" id="fileLine" style="margin:0"></p></div>
        <span class="sp"></span>
        <div class="field" id="sheetBox" hidden><label data-i="sheet"></label><select id="sheetSel"></select></div>
      </div>
      <div class="kpis" id="ovKpis" style="margin-top:14px"></div>
      <div class="sectitle" data-i="colsTitle"></div>
      <div class="scroll" style="max-height:340px"><table class="tbl" id="colTbl"></table></div>
      <div class="sectitle" data-i="previewTitle"></div>
      <div class="scroll"><table class="tbl" id="prevTbl"></table></div>
    </section>

    <section class="card" id="secClean">
      <h2 data-i="clean"></h2><p class="sub" data-i="cleanSub"></p>
      <div class="opts" id="cleanOpts"></div>
      <div class="row" style="margin-top:14px">
        <button class="btn primary" id="btnClean" type="button" data-i="apply"></button>
        <button class="btn" id="btnReset" type="button" data-i="reset"></button>
        <span class="sp"></span>
        <button class="btn small" id="btnDlCsv" type="button" data-i="dlCsv" hidden></button>
        <button class="btn small" id="btnDlXlsx" type="button" data-i="dlXlsx" hidden></button>
      </div>
      <ul class="log" id="cleanLog"></ul>
    </section>

    <section class="card" id="secAsk">
      <h2 data-i="ask"></h2><p class="sub" data-i="askSub"></p>
      <textarea id="q" data-ph="ph"></textarea>
      <div class="row" style="margin-top:10px">
        <button class="btn primary" id="btnGo" type="button" data-i="analyze"></button>
        <button class="btn" id="btnStop" type="button" hidden data-i="stop"></button>
        <button class="btn" id="btnAuto" type="button" data-i="auto"></button>
        <span class="sp"></span>
        <span id="busy" hidden><span class="spin"></span> <span data-i="thinking"></span></span>
      </div>
      <div class="chips" id="chips"></div>
      <div class="ai" id="aiBox" hidden>
        <label><input type="checkbox" id="aiOn" checked> <span data-i="useAI"></span></label>
        <div style="margin-top:4px" data-i="aiNote"></div>
      </div>
      <div id="askMsg"></div>

      <div class="sectitle" data-i="menuTitle"></div>
      <div class="menu">
        <div class="field"><label data-i="mAgg"></label><select id="mAgg"></select></div>
        <div class="field"><label data-i="mCol"></label><select id="mCol"></select></div>
        <div class="field"><label data-i="mGroup"></label><select id="mGroup"></select></div>
        <div class="field" id="fGrain" hidden><label data-i="mGrain"></label><select id="mGrain"></select></div>
        <div class="field"><label data-i="mOrder"></label><select id="mOrder"></select></div>
        <div class="field"><label data-i="mLimit"></label><select id="mLimit"></select></div>
        <div class="field"><label data-i="mChart"></label><select id="mChart"></select></div>
        <div class="field" style="grid-column:span 2"><label data-i="mFilter"></label>
          <div class="filterrow"><select id="fCol"></select><select id="fOp"></select><input id="fVal" type="text"></div></div>
      </div>
      <div class="row" style="margin-top:12px"><button class="btn primary" id="btnMenu" type="button" data-i="run"></button></div>
    </section>

    <section id="secRes">
      <div class="row" style="margin-bottom:10px">
        <h2 style="margin:0;font-size:1.15rem;font-weight:900" data-i="results"></h2><span class="sp"></span>
        <button class="btn small" id="btnDlAll" type="button" data-i="dlAll" hidden></button>
        <button class="btn small danger" id="btnClear" type="button" data-i="clearAll" hidden></button>
      </div>
      <div class="empty" id="resEmpty" data-i="resEmpty"></div>
      <div class="results" id="results"></div>
    </section>
  </div>
  <div class="foot" data-i="foot"></div>
</div>

  fillSelect($("fOp"), OPS.map((o) => [o, o === "!=" ? "≠" : o === ">=" ? "≥" : o === "<=" ? "≤" : o === "contains" ? t("op_contains") : o]), true);
  $("fVal").setAttribute("placeholder", t("fVal"));
  refreshMeasureOptions(); updateGrainVisibility();
}
function refreshMeasureOptions() {
  const agg = $("mAgg").value; const cur = $("mCol").value;
  let items;
  if (agg === "count") items = [["", t("rowsOpt")]].concat(S.cols.map((c) => [c.name, c.name]));
  else if (agg === "nunique") items = S.cols.map((c) => [c.name, c.name]);
  else items = numCols().map((c) => [c.name, c.name]);
  fillSelect($("mCol"), items, false); if (items.some(([v]) => v === cur)) $("mCol").value = cur;
}
function updateGrainVisibility() { const g = colByName($("mGroup").value); $("fGrain").hidden = !(g && g.type === "date"); }
function renderChips() {
  const m = pickMeasure(), cat = pickCats(1)[0], d = dateCols()[0]; const items = [];
  if (m && cat) items.push(lang === "ar" ? `${m.name} حسب ${cat.name}` : `${m.name} by ${cat.name}`);
  if (m && cat) items.push(lang === "ar" ? `أعلى 5 ${cat.name} حسب ${m.name}` : `top 5 ${cat.name} by ${m.name}`);
  if (m && d) items.push(lang === "ar" ? `${m.name} شهرياً` : `${m.name} monthly`);
  if (m) items.push(lang === "ar" ? `متوسط ${m.name}` : `average ${m.name}`);
  items.push(lang === "ar" ? "ملخص إحصائي" : "summary statistics", lang === "ar" ? "القيم الناقصة" : "missing values");
  $("chips").replaceChildren(el("small", { text: t("tryLbl"), style: "color:var(--muted);align-self:center" }), ...items.map((x) => el("button", { class: "chip", type: "button", text: x, onclick: () => { $("q").value = x; analyze(); } })));
}
function renderResultCard(res) {
  const card = el("div", { class: "res" + (res.wide ? " wide" : ""), id: res.id });
  card.append(el("h3", { text: res.title }));
  const you = [res.you, res.assumed].filter(Boolean).join(" • ");
  if (res.understood) card.append(el("div", { class: "you", text: t("understood") + " " + res.understood }));
  else if (you) card.append(el("div", { class: "you", text: you }));
  const pending = [];
  for (const b of res.blocks) {
    if (b.type === "bigk") card.append(el("div", { class: "bigk", text: b.value }));
    else if (b.type === "kpis") card.append(el("div", { class: "kpis" }, ...b.items.map(([l, v]) => el("div", { class: "kpi" }, el("small", { text: l }), el("b", { text: v })))));
    else if (b.type === "chart") { const cv = el("canvas"); card.append(el("div", { class: "chartbox" }, cv)); pending.push([cv, b]); }
    else if (b.type === "table") {
      if (b.caption) card.append(el("div", { class: "sectitle", text: b.caption }));
      const rows = b.rows;
      card.append(el("div", { class: "scroll", style: "margin-top:10px;max-height:" + (b.max ? b.max * 36 + 40 : 420) + "px" }, el("table", { class: "tbl" },
        el("thead", null, el("tr", null, ...b.cols.map((c) => el("th", { class: c.num ? "num" : "", text: c.label })))),
        el("tbody", null, ...rows.map((r) => el("tr", null, ...r.map((cell, i) => { const o = typeof cell === "object" && cell; return el("td", { class: b.cols[i] && b.cols[i].num ? "num" : "", style: o ? o.style : "", text: o ? o.text : cell }); })))))));
    }
  }
  if (res.insight) card.append(el("div", { class: "ins", text: res.insight }));
  const bar = el("div", { class: "bar" });
  if (res.exports.length && S.downloads) bar.append(el("button", { class: "btn small", type: "button", text: t("dlTbl"), onclick: () => saveCsv(res.exports[0].header, res.exports[0].rows, (res.title || "result").replace(/[^\w\u0600-\u06FF]+/g, "_").slice(0, 40) + ".csv") }));
  bar.append(el("button", { class: "btn small danger", type: "button", text: t("remove"), onclick: () => removeResult(res.id) }));
  card.append(bar);
  return { card, pending };
}
function drawCharts() {
  destroyCharts();
  for (const r of S.results) for (const b of r.blocks) if (b.type === "chart" && b._cv && typeof Chart !== "undefined") { try { charts.set(r.id + Math.random(), new Chart(b._cv, b.make())); } catch (e) { console.error(e); } }
}
function renderResults() {
  destroyCharts();
  const box = $("results"); box.replaceChildren();
  for (const r of S.results) { const { card, pending } = renderResultCard(r); box.append(card); for (const [cv, b] of pending) b._cv = cv; }
  $("resEmpty").hidden = S.results.length > 0; $("btnClear").hidden = !S.results.length; $("btnDlAll").hidden = !(S.results.length && S.downloads);
  drawCharts();
}
function addResults(list, understood) {
  if (understood && list.length) list[0].understood = understood;
  S.results = list.concat(S.results); renderResults();
  const first = $(list[0] && list[0].id); if (first) first.scrollIntoView({ behavior: "smooth", block: "nearest" });
}
function removeResult(id) { S.results = S.results.filter((r) => r.id !== id); renderResults(); }

/* ====================== downloads ====================== */
function csvEscape(v) { if (v == null) return ""; const s = String(v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
async function saveFile(filename, data) {
  if (!S.downloads) return;
  try { await S.downloads.save({ filename, data }); toast(t("dlOk")); } catch (e) { toast(e && e.code === "declined" ? t("dlNo") : t("dlFail")); }
}
function saveCsv(header, rows, filename) { return saveFile(filename, "\uFEFF" + [header].concat(rows).map((r) => r.map(csvEscape).join(",")).join("\r\n")); }
function toast(msg) { const m = $("askMsg"); m.replaceChildren(el("div", { class: "msg", text: msg })); }
function dataAoa() { return [S.headers].concat(S.data.map((r) => S.headers.map((h) => (r[h] == null ? "" : r[h])))); }
function saveCleanXlsx() {
  if (typeof XLSX === "undefined") return; const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(dataAoa()), "Cleaned_Data");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["Cleaning log"]].concat(S.cleanLog && S.cleanLog.length ? S.cleanLog.map((l) => [l]) : [[t("lgNone")]])), "Cleaning_Log");
  saveFile("cleaned_data.xlsx", XLSX.write(wb, { type: "array", bookType: "xlsx" }));
}
function saveAllResults() {
  if (typeof XLSX === "undefined") return; const wb = XLSX.utils.book_new(); const used = new Set(); let n = 0;
  for (const r of S.results) for (const e of r.exports) { let nm = e.name.replace(/[\\/?*[\]:]/g, " ").slice(0, 28) || "Sheet"; let k = nm, i = 2; while (used.has(k)) k = nm.slice(0, 25) + "_" + i++; used.add(k); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([e.header].concat(e.rows)), k); n++; }
  if (!n) return; saveFile("analysis_results.xlsx", XLSX.write(wb, { type: "array", bookType: "xlsx" }));
}

/* ====================== actions ====================== */
function setStatus(msg, err) { const s = $("upStatus"); s.textContent = msg || ""; s.className = "status" + (err ? " err" : ""); s.style.color = err ? "#FFB4B4" : "#C5D6E4"; }
function loadTable(name, headers, rows, sheets) {
  S.fileName = name; S.headers = headers; S.raw = rows; S.data = rows; S.cols = inferCols(headers, rows); S.cleanLog = []; S.results = [];
  S.sheets = sheets || null;
  $("main").hidden = false; $("cleanLog").replaceChildren(); $("btnDlCsv").hidden = !S.downloads; $("btnDlXlsx").hidden = !S.downloads;
  renderOverview(); renderCleanOpts(); renderMenu(); renderChips(); renderResults(); $("askMsg").replaceChildren();
  if (S.truncatedRows) setStatus(t("errBig", { n: fmtInt(S.truncatedRows) }));
}
function loadSheet(sheets, sheetName, fileName) {
  const tb = buildTable(sheets[sheetName]); S.sheetName = sheetName;
  loadTable(fileName, tb.headers, tb.rows, sheets);
  const box = $("sheetBox"); const names = Object.keys(sheets); box.hidden = names.length < 2;
  fillSelect($("sheetSel"), names.map((n) => [n, n]), false); $("sheetSel").value = sheetName;
}
async function handleFile(file) {
  if (!file) return; setStatus(t("loading"));
  try {
    const wb = await readWorkbook(file); const sheets = wbToSheets(wb); const names = Object.keys(sheets);
    if (!names.length) { setStatus(t("errEmpty"), true); return; }
    S.fileBook = sheets; setStatus(""); loadSheet(sheets, names[0], file.name);
    $("secOverview").scrollIntoView({ behavior: "smooth", block: "start" });
  } catch (e) { console.error(e); setStatus(e && e.message === "lib" ? t("errLib") : t("errRead"), true); }
}
/* demo data (deterministic, with realistic problems) */
function demoData() {
  let seed = 12345; const rnd = () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let x = Math.imul(seed ^ (seed >>> 15), 1 | seed); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
  const pick = (a) => a[Math.floor(rnd() * a.length)];
  const catalog = { Electronics: [["Laptop", 18000], ["Printer", 7200], ["Monitor", 5200]], Furniture: [["Desk", 4600], ["Office Chair", 3900]], Accessories: [["Headphones", 1200], ["Keyboard", 650], ["Mouse", 420]] };
  const cities = ["Cairo", "Alexandria", "Giza", "Mansoura", "Tanta"], ch = ["Online", "Store", "WhatsApp", "Facebook"], st = ["Paid", "Paid", "Paid", "Pending", "Refunded"];
  const H = ["Order_ID", "Order_Date", "Customer", "City", "Category", "Product", "Quantity", "Unit_Price", "Discount", "Revenue", "Channel", "Status"];
  const rows = [];
  for (let i = 1; i <= 320; i++) {
    const cat = pick(Object.keys(catalog)), [p, base] = pick(catalog[cat]); const qty = 1 + Math.floor(rnd() * 5), price = Math.round(base * (0.92 + rnd() * 0.16) * 100) / 100, disc = pick([0, 0, 0.05, 0.1, 0.15]);
    const m = 1 + Math.floor(rnd() * 12), d = 1 + Math.floor(rnd() * 28);
    rows.push({ Order_ID: "ORD-" + String(i).padStart(4, "0"), Order_Date: "2024-" + pad2(m) + "-" + pad2(d), Customer: "Customer " + String(1 + Math.floor(rnd() * 90)).padStart(3, "0"), City: pick(cities), Category: cat, Product: p, Quantity: qty, Unit_Price: price, Discount: disc, Revenue: Math.round(qty * price * (1 - disc) * 100) / 100, Channel: pick(ch), Status: pick(st) });
  }
  for (let i = 0; i < 6; i++) rows.push({ ...rows[10 + i * 17] });                      // duplicates
  [7, 41, 88, 130].forEach((i) => { rows[i].City = null; }); [19, 77].forEach((i) => { rows[i].Quantity = null; });
  [5, 23, 66].forEach((i) => { rows[i].City = " " + rows[i].City.toLowerCase() + " "; }); [9, 31].forEach((i) => { rows[i].Channel = rows[i].Channel.toUpperCase(); });
  [14, 52, 99, 150, 201].forEach((i) => { rows[i].Unit_Price = String(rows[i].Unit_Price.toFixed(2)).replace(/\B(?=(\d{3})+(?!\d))/g, ","); });
  [28, 120].forEach((i) => { rows[i].Order_Date = "not available"; }); [60, 170].forEach((i) => { const p = rows[i].Order_Date.split("-"); rows[i].Order_Date = p[2] + "/" + p[1] + "/" + p[0]; });
  return { headers: H, rows };
}
function applyClean() {
  const o = { dropEmpty: $("oDropEmpty").checked, trim: $("oTrim").checked, num: $("oNum").checked, date: $("oDate").checked, caseFix: $("oCase").checked, dedupe: $("oDedupe").checked, fillNum: $("fillNum").value, fillCat: $("fillCat").value };
  const { rows, log } = cleanData(o); S.data = rows; S.cleanLog = log; S.cols = inferCols(S.headers, rows);
  const ul = $("cleanLog"); ul.replaceChildren(...(log.length ? log.map((l) => el("li", { text: l })) : [el("li", { class: "none", text: t("lgNone") })]));
  S.results = []; renderOverview(); renderMenu(); renderChips(); renderResults(); $("btnDlCsv").hidden = !S.downloads; $("btnDlXlsx").hidden = !S.downloads;
}
function resetClean() { S.data = S.raw; S.cleanLog = []; S.cols = inferCols(S.headers, S.raw); $("cleanLog").replaceChildren(el("li", { class: "none", text: t("lgReset") })); S.results = []; renderOverview(); renderMenu(); renderChips(); renderResults(); }
function setBusy(on) { $("busy").hidden = !on; $("btnGo").disabled = on; $("btnStop").hidden = !on; }
async function analyze() {
  const text = $("q").value.trim(); if (!text || !S.data.length) return; $("askMsg").replaceChildren();
  let outSpecs = null, understood = "", note = "";
  if (S.sample && $("aiOn").checked) {
    S.ctl = new AbortController(); setBusy(true);
    try { const r = await aiParse(text, S.ctl.signal);
      if (r.specs.length) { outSpecs = r.specs; understood = r.understood; }
      else { note = r.message || (r.bad ? t("aiBadSpecs") : t("aiNoSpec")); }
    } catch (e) {
      const code = e && e.code;
      if (code === "cancelled") { setBusy(false); return; }
      if (code === "not_granted" || code === "sampling_disabled" || code === "not_declared" || code === "capability_disabled" || code === "capability_removed") { $("aiOn").checked = false; $("aiBox").hidden = true; S.sample = null; note = t("aiDenied"); }
      else if (code === "rate_limited") note = t("aiRate"); else note = t("aiFail");
    } finally { setBusy(false); S.ctl = null; }
  }
  if (!outSpecs) {
    const r = localParse(text);
    if (r.specs.length) outSpecs = r.specs;
    else { $("askMsg").replaceChildren(el("div", { class: "msg warn", text: (note && !S.sample ? note + " " : "") + t("cantUnderstand") })); return; }
  }
  if (note && !outSpecs.length) { $("askMsg").replaceChildren(el("div", { class: "msg warn", text: note })); return; }
  let list = []; for (const s of outSpecs) list = list.concat(runSpec(s));
  addResults(list, understood);
  if (note) $("askMsg").replaceChildren(el("div", { class: "msg", text: note }));
}
function menuSpec() {
  const agg = $("mAgg").value, mc = $("mCol").value, g = $("mGroup").value; const filters = [];
  if ($("fCol").value && $("fVal").value.trim()) filters.push({ column: $("fCol").value, op: $("fOp").value, value: $("fVal").value.trim() });
  const gc = g && colByName(g); const lim = parseInt($("mLimit").value, 10);
  return { type: "aggregate", agg, measure: mc || null, groupBy: g || null, grain: gc && gc.type === "date" ? $("mGrain").value : null, sort: $("mOrder").value, limit: isFinite(lim) ? lim : null, filters, chart: $("mChart").value, assumed: "" };
}
function runMenu() {
  if (!S.data.length) return; const s = menuSpec();
  if (s.agg !== "count" && !s.measure) { toast(t("auNeed")); return; }
  if (s.groupBy && colByName(s.groupBy).type === "date" && $("mOrder").value === "desc") s.sort = "key";
  addResults(runSpec(s), "");
}

/* ====================== init ====================== */
function setTheme(v) { if (v) document.documentElement.setAttribute("data-theme", v); else document.documentElement.removeAttribute("data-theme"); if (S.results.length) renderResults(); }
function initBindings() {
  const drop = $("drop"), file = $("file");
  drop.addEventListener("click", () => file.click());
  drop.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); file.click(); } });
  ["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", (e) => { const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (f) handleFile(f); });
  file.addEventListener("change", () => { handleFile(file.files[0]); file.value = ""; });
  $("btnDemo").addEventListener("click", () => { const d = demoData(); setStatus(""); S.truncatedRows = 0; loadTable("sample_sales.xlsx", d.headers, d.rows, null); $("sheetBox").hidden = true; $("secOverview").scrollIntoView({ behavior: "smooth", block: "start" }); });
  $("sheetSel").addEventListener("change", () => loadSheet(S.fileBook, $("sheetSel").value, S.fileName));
  $("btnClean").addEventListener("click", applyClean); $("btnReset").addEventListener("click", resetClean);
  $("btnDlCsv").addEventListener("click", () => saveCsv(S.headers, S.data.map((r) => S.headers.map((h) => r[h])), "cleaned_data.csv")); $("btnDlXlsx").addEventListener("click", saveCleanXlsx);
  $("btnGo").addEventListener("click", analyze); $("btnStop").addEventListener("click", () => { if (S.ctl) S.ctl.abort(); });
  $("q").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) analyze(); });
  $("btnAuto").addEventListener("click", () => addResults(buildAuto(), ""));
  $("mAgg").addEventListener("change", refreshMeasureOptions); $("mGroup").addEventListener("change", updateGrainVisibility); $("btnMenu").addEventListener("click", runMenu);
  $("btnClear").addEventListener("click", () => { S.results = []; renderResults(); }); $("btnDlAll").addEventListener("click", saveAllResults);
  $("aiOn").addEventListener("change", () => { S.aiOn = $("aiOn").checked; });
  $("btnLang").addEventListener("click", () => { lang = lang === "ar" ? "en" : "ar"; try { localStorage.setItem("da_lang", lang); } catch (e) {} applyLang(); if (S.cols.length) { renderOverview(); renderCleanOpts(); renderMenu(); renderChips(); S.results = []; renderResults(); $("cleanLog").replaceChildren(); $("askMsg").replaceChildren(); } });
  $("btnTheme").addEventListener("click", () => { const cur = document.documentElement.getAttribute("data-theme"); const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; setTheme(dark ? "light" : "dark"); });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (!document.documentElement.getAttribute("data-theme") && S.results.length) renderResults(); });
}
async function initCaps() {
  const cl = window.claude; if (!cl || typeof cl.use !== "function") return;
  try { const d = await cl.use("downloads"); if (d) { S.downloads = d; if (S.cols.length) { $("btnDlCsv").hidden = false; $("btnDlXlsx").hidden = false; renderResults(); } } } catch (e) {}
  try { const s = await cl.use("sample"); if (s && typeof s.json === "function") { S.sample = s; $("aiBox").hidden = false; } } catch (e) {}
}
applyLang(); initBindings(); initCaps();
window.__DA = { S, localParse, runSpec, analyze };
})();
